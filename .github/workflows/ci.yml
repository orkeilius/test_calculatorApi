name: CI — Tests & Couverture

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nodejs
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      - run: npm install
      - run: npm run lint

  test:
    name: Tests Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nodejs
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.x", "24.x"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install
      - run: npm run test:ci
      - name: Upload du rapport de couverture
        if: matrix.node-version == '22.x'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  java-test:
    name: Tests Java ${{ matrix.java-version }}
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        java-version: ["11", "17"]
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin
          cache: maven
      - run: mvn test --no-transfer-progress
      - name: Upload des rapports de test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-java-${{ matrix.java-version }}
          path: java/target/surefire-reports/
          retention-days: 30

  c-asm-test:
    name: Tests C/ASM
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: c-asm
    steps:
      - uses: actions/checkout@v5
      - name: Installer NASM et GCC
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm gcc
      - name: Compiler l'assembly
        run: nasm -f elf64 operations.asm -o operations.o
      - name: Compiler les tests C
        run: gcc full_test.c operations.o -o full_test -lm
      - name: Lancer les tests C/ASM
        run: ./full_test

  php-test:
    name: Tests PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.2", "8.3"]
    defaults:
      run:
        working-directory: php
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: pcov
          tools: composer:v2
      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: php/vendor
          key: composer-${{ runner.os }}-${{ matrix.php-version }}-${{ hashFiles('php/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-${{ matrix.php-version }}-
            composer-${{ runner.os }}-
      - run: composer install --no-interaction --prefer-dist
      - name: Syntax check
        run: find src/ public/ tests/ -name '*.php' -exec php -l {} \; > /dev/null
      - run: php vendor/bin/phpunit --coverage-clover coverage/clover.xml --coverage-html coverage
      - name: Upload du rapport de couverture
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-php-${{ matrix.php-version }}
          path: php/coverage/
          retention-days: 30
